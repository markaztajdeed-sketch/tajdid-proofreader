<title>محرر تجديد</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Noto+Naskh+Arabic:wght@400;600;700&display=swap">
<style>
/* Layout: a proofreader's desk. Header of controls, the text as a page in the middle, the corrections queue beside it, a status strip below. */
:root {
  /* ألوان واجهة المركز (tajdid-app): كحلي #0E2A47، أزرق #1F6FB2، ذهبي #D4AF37 */
  --bg: #F2F5F7; --surface: #FFFFFF; --sunken: #EEF2F6; --ink: #192A3D; --muted: #4F5F72; --line: #E1E8ED;
  --accent: #1F6FB2; --accent-ink: #FFFFFF; --primary: #1F6FB2; --brand: #0E2A47; --gold: #D4AF37; --nav-act: #E6F0FA;
  --punct: #2F5FB3; --spell: #B03345; --conv: #8A5F0E; --style: #6A4C9E;
  --good: #2E7D4F; --quran: #DCE6F0;
  --ui: "IBM Plex Sans Arabic", "Segoe UI", Tahoma, sans-serif;
  --text: "Noto Naskh Arabic", "Traditional Arabic", "Times New Roman", serif;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  /* الوضع الغامق على طريقة VS Code */
  --bg: #1E1E1E; --surface: #252526; --sunken: #2D2D2D; --ink: #D4D4D4; --muted: #9D9D9D; --line: #3C3C3C;
  --accent: #3794FF; --accent-ink: #FFFFFF; --primary: #0E639C; --brand: #CCCCCC; --gold: #D7BA7D; --nav-act: #37373D;
  --punct: #86A9EE; --spell: #EF8B98; --conv: #D8B160; --style: #B6A0DC; --good: #6CCB93; --quran: #3A3D41; color-scheme: dark } }
:root[data-theme="dark"] {
  /* الوضع الغامق على طريقة VS Code */
  --bg: #1E1E1E; --surface: #252526; --sunken: #2D2D2D; --ink: #D4D4D4; --muted: #9D9D9D; --line: #3C3C3C;
  --accent: #3794FF; --accent-ink: #FFFFFF; --primary: #0E639C; --brand: #CCCCCC; --gold: #D7BA7D; --nav-act: #37373D;
  --punct: #86A9EE; --spell: #EF8B98; --conv: #D8B160; --style: #B6A0DC; --good: #6CCB93; --quran: #3A3D41; color-scheme: dark }

html, body { height: 100%; }
[hidden] { display: none !important; }
.pop, .pop *, .reason { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--ui); font-size: 14px; }
.app { height: 100%; display: grid; grid-template-rows: auto 1fr auto; direction: rtl; }
button, select, input, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

/* header */
.top { background: var(--surface); border-top: 3px solid var(--gold); border-bottom: 1px solid var(--line); padding-block: 10px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: flex; flex-wrap: wrap; align-items: center; gap: 10px 16px; }
.nav svg { width: 20px; height: 20px; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; flex: none; }
.doc { display: flex; align-items: center; gap: 8px; min-width: 0; flex: 1 1 220px; }
.doc-name { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
.tag { font-size: 11px; padding: 1px 7px; border-radius: 99px; background: var(--sunken); border: 1px solid var(--line); color: var(--muted); white-space: nowrap; }
.ctrls { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
.field { display: flex; align-items: center; gap: 6px; font-size: 13px; color: var(--muted); }
select, .chk { border: 1px solid var(--line); background: var(--surface); border-radius: 6px; padding: 5px 8px; }
.chk { display: inline-flex; align-items: center; gap: 6px; color: var(--ink); cursor: pointer; }
.btn { border: 1px solid var(--line); background: var(--surface); border-radius: 6px; padding: 6px 12px; display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; }
.btn:hover { background: var(--sunken); }
.btn[disabled] { opacity: .45; cursor: default; }
.btn.primary { background: var(--primary); color: #FFFFFF; border-color: var(--primary); font-weight: 600; }
.btn.primary:hover { filter: brightness(1.08); }
.sep { width: 1px; align-self: stretch; background: var(--line); }

/* main */
.main { min-height: 0; display: grid; grid-template-columns: minmax(0, 1fr) 320px; }
/* القائمة الجانبية بطول الصفحة: تنطوي إلى شريط أيقونات وتنفتح بالأسماء */
.shell { height: 100%; display: flex; direction: rtl; }
.shell > .app { flex: 1; min-width: 0; }
.nav { position: relative; flex: none; width: 64px; height: 100%; background: var(--surface); border-inline-end: 1px solid var(--line);
  display: flex; flex-direction: column; padding: 14px 10px; gap: 4px; transition: width .18s; z-index: 5; box-sizing: border-box; overflow: visible; }
.shell.nav-open .nav { width: 220px; }
.nav-logo { display: flex; align-items: center; gap: 10px; padding: 0 6px 18px; color: var(--brand); font-weight: 700; font-size: 15px; white-space: nowrap; overflow: hidden; }
.nav-logo img { width: 32px; height: 32px; flex: none; }
.nav-toggle { position: absolute; top: 46px; inset-inline-end: -15px; width: 30px; height: 30px; border-radius: 50%;
  border: 1px solid var(--line); background: var(--surface); color: var(--muted); display: grid; place-items: center; padding: 0; box-shadow: 0 1px 3px rgba(0,0,0,.12); }
.nav-toggle:hover { color: var(--ink); }
.nav-toggle svg { width: 16px; height: 16px; transform: scaleX(-1); }
.shell.nav-open .nav-toggle svg { transform: none; }
/* مطوية: مربع صغير حول الأيقونة فقط */
.shell:not(.nav-open) .nav { align-items: center; }
.shell:not(.nav-open) .nav-item { width: 40px; height: 40px; padding: 0; justify-content: center; gap: 0; }
.shell:not(.nav-open) .nav-item .lbl, .shell:not(.nav-open) .nav-logo .lbl { display: none; }
.shell:not(.nav-open) .nav-logo { padding: 0 0 18px; }
.nav-item { display: flex; align-items: center; gap: 12px; padding: 10px 11px; border-radius: 8px; border: 0; background: none; width: 100%;
  color: var(--muted); text-decoration: none; font-size: 14px; white-space: nowrap; overflow: hidden; text-align: start; }
.nav-item:hover { background: var(--sunken); color: var(--ink); }
.nav-item[aria-current="page"] { background: var(--nav-act); color: var(--accent); font-weight: 600; }
.nav-item.soon { cursor: default; }
.nav-item.soon:hover { background: none; color: var(--muted); }
.nav-item .lbl, .nav-logo .lbl { opacity: 0; transition: opacity .12s; }
.shell.nav-open .nav-item .lbl, .shell.nav-open .nav-logo .lbl { opacity: 1; }
.nav-item .soon-tag { margin-inline-start: auto; font-size: 10.5px; border: 1px solid var(--line); border-radius: 99px; padding: 0 6px; display: none; }
.shell.nav-open .nav-item .soon-tag { display: inline; }
.nav-fill { flex: 1; }
.nav-sep { height: 1px; background: var(--line); margin: 6px 4px; }
.desk { min-height: 0; overflow: auto; padding-block: 24px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.page { max-width: 760px; margin: 0 auto; background: var(--surface); border: 1px solid var(--line); border-radius: 4px;
  padding: 40px clamp(18px, 5vw, 56px); font-family: var(--text); font-size: 19px; line-height: 2.05; }
.page.drag { outline: 2px dashed var(--accent); outline-offset: 6px; }
.notes-h { font-family: var(--ui); font-size: 12px; font-weight: 600; color: var(--muted); letter-spacing: .02em;
  border-top: 1px solid var(--line); margin-top: 28px; padding-top: 14px; }
.para { position: relative; margin: 0 0 14px; text-align: justify; border-radius: 3px; }
.para.note { font-size: 15.5px; line-height: 1.95; margin-bottom: 8px; }
.para.flash { animation: flash 1.2s ease-out; }
@keyframes flash { from { background: color-mix(in srgb, var(--accent) 18%, transparent); } to { background: transparent; } }
.para .edit { position: absolute; inset-inline-start: calc(100% + 4px); top: 4px; font-family: var(--ui); font-size: 12px;
  border: 1px solid var(--line); background: var(--surface); color: var(--muted); border-radius: 5px; padding: 1px 6px; line-height: 1.6; opacity: 0; }
.para:hover .edit, .para .edit:focus-visible { opacity: 1; }
.para.manual::after { content: "عدّله المدقق"; font-family: var(--ui); font-size: 11px; color: var(--muted); margin-inline-start: 8px; }
.quran { background: color-mix(in srgb, var(--quran) 45%, transparent); border-radius: 3px; }
sup.fn { font-family: var(--ui); font-size: 11px; color: var(--accent); font-weight: 600; padding: 0 1px; }
.ob { font-family: var(--ui); font-size: 11px; color: var(--muted); }

.chg { cursor: pointer; border-radius: 3px; padding: 2px 2px; margin: 0 -1px; }
.chg.only-del del { display: inline-block; min-width: 10px; text-align: center; }
.page[class*="focus-"] .chg, .page[class*="focus-"] .done { opacity: .28; }
.page.focus-punct .c-punct, .page.focus-spell .c-spell, .page.focus-conv .c-conv { opacity: 1 !important; }
.chg.hot { background: color-mix(in srgb, var(--c) 10%, transparent); outline: 1px solid color-mix(in srgb, var(--c) 45%, transparent); }
/* popup on an error */
.pop { position: fixed; z-index: 30; width: 300px; background: var(--surface); border: 1px solid var(--line); border-radius: 8px;
  box-shadow: 0 8px 28px rgba(0,0,0,.16); padding: 10px 12px; display: grid; gap: 7px; direction: rtl; font-family: var(--ui); }
.pop .card-h .name { font-size: 13.5px; }
.pop .chgline { font-family: var(--text); font-size: 17px; line-height: 1.6; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.pop .chgline del { color: var(--spell); }
.pop .chgline ins { color: var(--good); text-decoration: none; font-weight: 700; }
.pop .chgline .arr { font-family: var(--ui); color: var(--muted); font-size: 13px; }
.pop .why { font-size: 12.5px; }
.pop .acts .btn { flex: 1; justify-content: center; }
.chg del { color: var(--c); text-decoration: line-through; text-decoration-thickness: 1.5px; opacity: .8; }
.chg ins { color: var(--c); text-decoration: none; background: color-mix(in srgb, var(--c) 14%, transparent); border-bottom: 2px solid var(--c); border-radius: 2px; padding: 0 1px; }
.chg.only-del del { background: color-mix(in srgb, var(--c) 12%, transparent); }
.done { border-bottom: 1px dotted color-mix(in srgb, var(--good) 70%, transparent); cursor: pointer; }
.done.gap { display: inline-block; width: 3px; height: .9em; vertical-align: middle; background: color-mix(in srgb, var(--good) 45%, transparent); border: 0; border-radius: 2px; }
.rej { cursor: pointer; }
.plain { cursor: pointer; }
.chg.wd del + ins { margin-inline-start: 5px; }
.chg.marks { color: var(--c); text-decoration: underline wavy color-mix(in srgb, var(--c) 75%, transparent); text-underline-offset: 6px; text-decoration-thickness: 1.5px; padding: 0; margin: 0; }
.chg.marks.hot { text-decoration-style: solid; }
.done.wd { border-bottom: 0; text-decoration: underline color-mix(in srgb, var(--good) 65%, transparent); text-underline-offset: 6px; text-decoration-thickness: 1.5px; }
.pop { max-height: calc(100vh - 24px); overflow: auto; }
.pop .pg { display: grid; gap: 7px; }
.pop .pg-sep { border: 0; border-top: 1px dashed var(--line); margin: 4px 0; width: 100%; }
.sel { outline: 2px solid var(--c, var(--accent)); outline-offset: 1px; border-radius: 3px; }
.c-punct { --c: var(--punct); } .c-spell { --c: var(--spell); } .c-conv { --c: var(--conv); } .c-style { --c: var(--style); }
.editbox { width: 100%; min-height: 120px; font-family: var(--text); font-size: 18px; line-height: 1.9; border: 1px solid var(--accent); border-radius: 4px; padding: 8px 10px; background: var(--sunken); resize: vertical; direction: rtl; }
.editbar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; font-family: var(--ui); font-size: 12px; color: var(--muted); margin-top: 6px; }
.editbar .err { color: var(--spell); }

/* side panel */
.side { position: relative; min-height: 0; display: flex; flex-direction: column; border-inline-start: 1px solid var(--line); background: var(--sunken); }
/* قائمة التصحيحات تنطوي إلى شريط ضيق فيه الأعداد فقط */
.main.side-closed { grid-template-columns: minmax(0, 1fr) 64px; }
.side-toggle { flex: none; width: 28px; height: 28px; border-radius: 6px; border: 0; background: none; color: var(--muted); display: grid; place-items: center; padding: 0; }
.side-toggle:hover { background: var(--surface); color: var(--ink); }
.side-toggle svg { width: 16px; height: 16px; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; transform: scaleX(-1); }
.side-closed .side-toggle svg { transform: none; }
.side-closed .side-head { padding: 14px 10px 10px; border-bottom: 0; }
.side-closed .side-title { justify-content: center; }
.side-closed .side-title h2, .side-closed .side-title small { display: none; }
.side-closed #listToggle, .side-closed #listTools, .side-closed .cards, .side-closed .sum-row .link, .side-closed .sum-row .nm { display: none !important; }
.side-closed .sum { justify-items: center; gap: 6px; }
.side-closed .sum-row { width: 44px; height: 44px; padding: 0; justify-content: center; }
.side-closed .sum-row .pick { flex: none; flex-direction: column; gap: 3px; align-items: center; }
.side-closed .sum-row b { margin: 0; font-size: 12.5px; }
.side-head { padding: 14px 16px 10px; display: grid; gap: 10px; border-bottom: 1px solid var(--line); }
.side-title { display: flex; align-items: center; gap: 8px; }
.side-title small { margin-inline-start: auto; }
.side-title h2 { margin: 0; font-size: 15px; }
.side-title small { color: var(--muted); font-variant-numeric: tabular-nums; }
.sum { display: grid; gap: 2px; }
.sum-row { display: flex; align-items: center; gap: 8px; padding: 5px 8px; border-radius: 6px; }
.sum-row .pick { flex: 1; display: flex; align-items: center; gap: 8px; border: 0; background: none; padding: 0; text-align: start; }
.sum-row .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--c, var(--muted)); flex: none; }
.sum-row b { font-variant-numeric: tabular-nums; font-weight: 600; margin-inline-start: auto; }
.sum-row.on { background: var(--surface); box-shadow: inset 0 0 0 1px var(--line); }
.sum-row.off { opacity: .55; }
.sum-row .link { font-size: 12px; }
.cat { border: 1px solid var(--line); background: var(--surface); border-radius: 99px; padding: 3px 10px; font-size: 12.5px; display: inline-flex; align-items: center; gap: 6px; }
.cat .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--c, var(--muted)); }
.cat b { font-weight: 600; font-variant-numeric: tabular-nums; }
.cat[aria-pressed="true"] { border-color: var(--ink); background: var(--ink); color: var(--surface); }
.cat[disabled] { opacity: .55; cursor: default; }
.side-tools { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; justify-content: space-between; font-size: 12.5px; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 6px; overflow: hidden; }
.seg button { border: 0; background: var(--surface); padding: 4px 10px; }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--surface); }
.link { border: 0; background: none; color: var(--accent); padding: 0; font-weight: 600; }
.link[disabled] { color: var(--muted); font-weight: 400; cursor: default; }
.cards { flex: 1; min-height: 0; overflow: auto; padding: 12px; display: grid; gap: 10px; align-content: start; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 12px; display: grid; gap: 8px; cursor: pointer; }
.card.sel { border-color: var(--c); box-shadow: 0 0 0 1px var(--c); outline: 0; }
.card.decided { background: color-mix(in srgb, var(--surface) 55%, var(--sunken)); }
.card-h { display: flex; align-items: center; gap: 8px; }
.card-h .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--c); flex: none; }
.card-h .name { font-weight: 600; flex: 1; min-width: 0; }
.rno { font-size: 11px; color: var(--muted); border: 1px solid var(--line); border-radius: 4px; padding: 0 5px; white-space: nowrap; font-variant-numeric: tabular-nums; }
.ba { font-family: var(--text); font-size: 15.5px; line-height: 1.8; display: grid; gap: 2px; background: var(--sunken); border-radius: 6px; padding: 6px 10px; }
.ba div { display: flex; gap: 8px; }
.ba span.k { font-family: var(--ui); font-size: 11px; color: var(--muted); min-width: 30px; padding-top: 5px; }
.ba .t { flex: 1; min-width: 0; overflow-wrap: anywhere; color: var(--muted); }
.ba .t mark { background: none; color: var(--ink); font-weight: 700; }
.ba .t mark.d { color: var(--spell); text-decoration: line-through; }
.ba .t mark.i { color: var(--good); }
.why { color: var(--muted); font-size: 13px; line-height: 1.7; margin: 0; }
.acts { display: flex; gap: 8px; align-items: center; }
.acts .btn { padding: 4px 14px; }
.btn.ok { border-color: color-mix(in srgb, var(--good) 50%, var(--line)); color: var(--good); font-weight: 600; }
.btn.no { color: var(--spell); }
.state { font-size: 12px; font-weight: 600; }
.state.ok { color: var(--good); } .state.no { color: var(--spell); }
.reason { width: 100%; border: 1px solid var(--line); border-radius: 6px; padding: 6px 8px; background: var(--surface); font-size: 13px; }
.empty { color: var(--muted); text-align: center; padding: 30px 12px; line-height: 1.8; }

/* status strip */
.bar { background: var(--surface); border-top: 1px solid var(--line); padding-block: 7px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: flex; flex-wrap: wrap; gap: 6px 18px; align-items: center; font-size: 12.5px; color: var(--muted); font-variant-numeric: tabular-nums; }
.bar b { color: var(--ink); font-weight: 600; }
.bar .warn { border: 0; background: none; color: var(--conv); font-weight: 600; padding: 0; }
.bar .msg { margin-inline-start: auto; color: var(--ink); }
.bar .msg.err { color: var(--spell); }
.legend { display: inline-flex; gap: 10px; flex-wrap: wrap; }
.legend span { display: inline-flex; align-items: center; gap: 4px; }
.legend i { width: 8px; height: 8px; border-radius: 50%; background: var(--c); }
input[type=file] { display: none; }
.btn[aria-pressed="true"] { background: var(--ink); color: var(--surface); border-color: var(--ink); }

/* checking options dialog */
.opts { width: min(980px, calc(100vw - 48px)); max-height: calc(100vh - 64px); border: 1px solid var(--line); border-radius: 10px; padding: 0;
  background: var(--surface); color: var(--ink); direction: rtl; font-family: var(--ui); box-shadow: 0 16px 48px rgba(0,0,0,.25); }
.opts::backdrop { background: rgba(10,14,13,.45); }
.opts-h { position: sticky; top: 0; background: var(--surface); border-bottom: 1px solid var(--line); padding: 14px 20px; display: flex; align-items: center; gap: 12px; z-index: 1; }
.opts-h h2 { margin: 0; font-size: 16px; flex: 1; }
.opts-h small { color: var(--muted); }
.opts-b { padding: 6px 20px 20px; }
.opts-b h3 { font-size: 13.5px; margin: 18px 0 6px; display: flex; align-items: center; gap: 8px; }
.opts-b h3 .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--c); }
.otable { width: 100%; border-collapse: collapse; font-size: 13px; }
.otable th { text-align: start; font-weight: 600; color: var(--muted); font-size: 12px; padding: 6px 8px; border-bottom: 1px solid var(--line); }
.otable td { padding: 8px; border-bottom: 1px solid var(--line); vertical-align: top; line-height: 1.7; }
.otable tr.off td:not(:last-child) { opacity: .45; }
.otable .rn { font-weight: 600; }
.otable .ex { font-family: var(--text); font-size: 15px; white-space: nowrap; }
.otable .ex del { color: var(--spell); text-decoration: line-through; }
.otable .ex ins { color: var(--good); text-decoration: none; font-weight: 700; }
.otable .ex .arr { font-family: var(--ui); color: var(--muted); margin: 0 6px; font-size: 12px; }
.otable td.sw { width: 64px; text-align: center; }
.switch { appearance: none; width: 36px; height: 20px; border-radius: 99px; background: var(--line); position: relative; cursor: pointer; transition: background .15s; margin: 4px 0 0; }
.switch::after { content: ""; position: absolute; top: 2px; inset-inline-start: 2px; width: 16px; height: 16px; border-radius: 50%; background: var(--surface); box-shadow: 0 1px 2px rgba(0,0,0,.3); transition: inset-inline-start .15s; }
.switch:checked { background: var(--accent); }
.switch:checked::after { inset-inline-start: 18px; }

@media (max-width: 900px) {
  .app { height: auto; min-height: 100%; }
  .main { grid-template-columns: minmax(0, 1fr); }
  .desk { overflow: visible; }
  .side { border-inline-start: 0; border-top: 1px solid var(--line); }
  .cards { overflow: visible; }
  .para .edit { position: static; opacity: 1; margin-inline-start: 6px; vertical-align: middle; }
  .page { font-size: 17.5px; padding: 24px 16px; }
}
@media (prefers-reduced-motion: reduce) { .para.flash { animation: none; } * { scroll-behavior: auto !important; } }
</style>

/* Tajdid proofreading engine: tier-1 (deterministic) rules applied to a .docx as tracked changes. */
(function (root) {
  'use strict';
  const W = 'http://schemas.openxmlformats.org/wordprocessingml/2006/main';
  const XMLNS = 'http://www.w3.org/XML/1998/namespace';
  const L = '\\u0621-\\u064A\\u066E-\\u06D3\\u06FA-\\u06FF';   // Arabic letters (no harakat)
  const H = '\\u064B-\\u065F\\u0670';                           // harakat
  const LH = L + H;
  const FN = '\uE001';   // footnote / endnote reference placeholder
  const OB = '\uFFFC';   // other opaque content placeholder
  const re = (s, f) => new RegExp(s.replace(/\{L\}/g, L).replace(/\{H\}/g, H).replace(/\{LH\}/g, LH), f || 'g');
  const fuzzy = s => [...s].map(c => (c === ' ' ? '\\s+' : c + '[' + H + ']*')).join('');

  // ---------------------------------------------------------------- rules
  // Each rule: id, no (guide rule number), name, why, scope ('all'|'notes'), word (skip inside quotes), find(text, ctx) -> edits
  const simple = (rx, repl) => text => {
    const out = [];
    rx.lastIndex = 0;
    let m;
    while ((m = rx.exec(text))) {
      const r = typeof repl === 'function' ? repl(m) : m[0].replace(new RegExp(rx.source, rx.flags.replace('g', '')), repl);
      if (r !== null && r !== m[0]) out.push({ start: m.index, end: m.index + m[0].length, repl: r });
      if (m[0].length === 0) rx.lastIndex++;
    }
    return out;
  };

  const LEVANT = [['كانون الثاني', 'يناير'], ['شباط', 'فبراير'], ['آذار', 'مارس'], ['نيسان', 'أبريل'], ['أيار', 'مايو'], ['حزيران', 'يونيو'], ['تموز', 'يوليو'], ['آب', 'أغسطس'], ['أيلول', 'سبتمبر'], ['تشرين الأول', 'أكتوبر'], ['تشرين الثاني', 'نوفمبر'], ['كانون الأول', 'ديسمبر']];
  const GREG_ALIASES = { 'إبريل': 'أبريل', 'يونيه': 'يونيو', 'يوليه': 'يوليو' };
  const NISBA_EXCEPT = new Set(['كرسي', 'بديهي']);
  const WORDS = [
    ['أفريقي', 'إفريقي'], ['إيديولوج', 'أيديولوج'], ['إنثروبولوج', 'أنثروبولوج'], ['أثنولوج', 'إثنولوج'],
    ['أبستمولوج', 'إبستمولوج'], ['أنترنت', 'إنترنت'], ['ليبيرالي', 'ليبرالي'], ['مسئول', 'مسؤول']

  const CAT = { punct: ['sp-before', 'sp-after', 'br-inner', 'dash-pair', 'dash-num', 'slash', 'sp-double', 'dot-out', 'aw-quote', 'fn-space'],
    spell: ['sun-shadda', 'nisba-shadda', 'tanween', 'ma-la', 'ma-shadda', 'tatweel', 'words', 'ya-dots', 'inna', 'shadda-common'],
    conv: ['year-paren', 'months', 'salawat', 'salam', 'page', 'abbr', 'ibid', 'digits', 'quote-type'] };
  for (const [c, ids] of Object.entries(CAT)) ids.forEach(id => { const r = RULES.find(x => x.id === id); if (r) r.cat = c; });

  // ---------------------------------------------------------------- helpers
  const kids = n => { const a = []; for (let c = n.firstChild; c; c = c.nextSibling) if (c.nodeType === 1) a.push(c); return a; };
  const isW = (n, name) => n.namespaceURI === W && n.localName === name;
  const ZERO_WIDTH = new Set(['pPr', 'bookmarkStart', 'bookmarkEnd', 'proofErr', 'commentRangeStart', 'commentRangeEnd', 'permStart', 'permEnd']);

  function classifyRun(r) {
    let text = '', ok = true, note = false;
    for (const c of kids(r)) {
      if (c.namespaceURI !== W) { ok = false; continue; }
      if (c.localName === 'rPr' || c.localName === 'lastRenderedPageBreak') continue;
      if (c.localName === 't') { text += c.textContent; continue; }
      if (c.localName === 'footnoteReference' || c.localName === 'endnoteReference') note = true;
      ok = false;
    }
    if (ok) return { kind: 'text', text };
    return { kind: 'opaque', text: note ? FN : OB };
  }

  function minimalEdit(text, e) {
    const a = text.slice(e.start, e.end), b = e.repl;
    let p = 0; while (p < a.length && p < b.length && a[p] === b[p]) p++;
    let s = 0; while (s < a.length - p && s < b.length - p && a[a.length - 1 - s] === b[b.length - 1 - s]) s++;
    return { start: e.start + p, end: e.end - s, repl: b.slice(p, b.length - s) };
  }

  function pairRanges(text) {
    const straight = [];
    let open = -1;
    for (let i = 0; i < text.length; i++) if (text[i] === '"') { if (open < 0) open = i; else { straight.push([open, i]); open = -1; } }
    const ranges = straight.map(p => [p[0], p[1]]);
    const unbalanced = [];
    if (open >= 0) unbalanced.push('"');
    const pairs = [['«', '»'], ['“', '”'], ['(', ')'], ['[', ']']];
    const quran = [];
    for (const [o, c] of pairs) {
      const st = [];
      for (let i = 0; i < text.length; i++) {
        if (text[i] === o) st.push(i);
        else if (text[i] === c) { if (st.length) { const a = st.pop(); if (o !== '(' && o !== '[') ranges.push([a, i]); } else unbalanced.push(c); }
      }
      if (st.length) unbalanced.push(o);
    }
    // Quran ornate brackets: either orientation, paired in order
    let q = -1;
    for (let i = 0; i < text.length; i++) if (text[i] === '\uFD3F' || text[i] === '\uFD3E') { if (q < 0) q = i; else { quran.push([q, i]); q = -1; } }
    if (q >= 0) unbalanced.push('﴿');
    return { straight, quotes: ranges, quran, unbalanced };
  }

  const overlaps = (s, e, ranges) => ranges.some(([a, b]) => (e > s ? s <= b && e - 1 >= a : s > a && s <= b));

  // ---------------------------------------------------------------- paragraph processing
  function readParagraph(p) {
    if (p.getElementsByTagNameNS(W, 'ins').length || p.getElementsByTagNameNS(W, 'del').length ||
        p.getElementsByTagNameNS(W, 'moveFrom').length || p.getElementsByTagNameNS(W, 'moveTo').length) return null;
    const segs = [];
    let text = '';
    for (const c of kids(p)) {
      if (c.namespaceURI === W && ZERO_WIDTH.has(c.localName)) { segs.push({ node: c, kind: 'opaque', start: text.length, text: '' }); continue; }
      const k = isW(c, 'r') ? classifyRun(c) : { kind: 'opaque', text: OB };
      segs.push({ node: c, kind: k.kind, start: text.length, text: k.text });
      text += k.text;
    }
    if (!/[\u0600-\u06FF]/.test(text)) return null;
    return { segs, text };
  }

  // Find rule groups in one paragraph's text. Each group: { rule, edits:[{start,end,repl,rule}], lo, hi, before, after }
  function findGroups(text, ctx) {
    const pr = pairRanges(text);
    const warnings = [];
    if (pr.unbalanced.length) warnings.push({ where: ctx.where, kind: 'unbalanced', marks: [...new Set(pr.unbalanced)].join(' '), snippet: snippet(text, 0, 0) });
    const rctx = { straightPairs: pr.straight, lexicon: ctx.lexicon };
    const accepted = [], groups = [];
    const busy = (s, e) => accepted.some(a => (e > s ? s < a.end && e > a.start : false) || (e === s && a.start === s && a.end === s) || (e === s && s > a.start && s < a.end) || (e > s && a.end === a.start && a.start > s && a.start < e));
    for (const rule of RULES) {
      if (rule.scope === 'notes' && !ctx.inNotes) continue;
      if (rule.translatedOff && ctx.opts.translated) continue;
      if (rule.optional && !ctx.opts[rule.optional]) continue;
      let found;
      try { found = rule.find(text, rctx); } catch (err) { continue; }
      for (const f of found) {
        const group = (f.group || [f]).map(e => minimalEdit(text, e)).filter(e => e.end > e.start || e.repl);
        if (!group.length) continue;
        let ok = true;
        for (const e of group) {
          const del = text.slice(e.start, e.end);
          if (del.includes(OB) || del.includes(FN)) ok = false;
          if (overlaps(e.start, e.end, pr.quran)) ok = false;
          if (rule.word && overlaps(e.start, e.end, pr.quotes)) ok = false;
          if (busy(e.start, e.end)) ok = false;
        }
        if (!ok) continue;
        const ruleTag = { id: rule.id, no: rule.no, label: rule.label, name: rule.name, why: rule.why, cat: rule.cat };
        group.forEach(e => accepted.push(Object.assign(e, { rule: ruleTag })));
        const lo = Math.min(...group.map(e => e.start)), hi = Math.max(...group.map(e => e.end));
        const after = applyEdits(text, group);
        groups.push({ rule: ruleTag, edits: group, lo, hi,
          before: snippet(text, lo, hi), after: snippet(after, lo, hi + group.reduce((n, e) => n + e.repl.length - (e.end - e.start), 0)) });
      }
    }
    return { groups, warnings, quran: pr.quran };
  }

  function processParagraph(p, ctx) {
    const rp = readParagraph(p);
    if (!rp) return;
    const { groups, warnings } = findGroups(rp.text, ctx);
    ctx.warnings.push(...warnings);
    groups.forEach(g => ctx.changes.push({ where: ctx.where, rule: g.rule, before: g.before, after: g.after }));
    const edits = groups.flatMap(g => g.edits);
    if (edits.length) rebuild(p, rp.segs, rp.text, edits, ctx);
  }

  // Character diff (trimmed common prefix/suffix, then LCS on the middle) -> edits on `a`
  function diffEdits(a, b, rule) {
    let p = 0; while (p < a.length && p < b.length && a[p] === b[p]) p++;
    let s = 0; while (s < a.length - p && s < b.length - p && a[a.length - 1 - s] === b[b.length - 1 - s]) s++;
    const A = a.slice(p, a.length - s), B = b.slice(p, b.length - s);
    if (!A.length && !B.length) return [];
    if (A.length * B.length > 4e6) return [{ start: p, end: p + A.length, repl: B, rule }];
    const n = A.length, m = B.length, D = new Uint16Array((n + 1) * (m + 1));
    for (let i = n - 1; i >= 0; i--) for (let j = m - 1; j >= 0; j--)
      D[i * (m + 1) + j] = A[i] === B[j] ? D[(i + 1) * (m + 1) + j + 1] + 1 : Math.max(D[(i + 1) * (m + 1) + j], D[i * (m + 1) + j + 1]);
    const out = []; let i = 0, j = 0, cur = null;
    const flush = () => { if (cur) { out.push(cur); cur = null; } };
    while (i < n || j < m) {
      if (i < n && j < m && A[i] === B[j]) { flush(); i++; j++; }
      else if (j < m && (i === n || D[i * (m + 1) + j + 1] >= D[(i + 1) * (m + 1) + j])) { if (!cur) cur = { start: p + i, end: p + i, repl: '', rule }; cur.repl += B[j]; j++; }
      else { if (!cur) cur = { start: p + i, end: p + i, repl: '', rule }; cur.end = p + i + 1; i++; }
    }
    flush();
    return out;
  }

  const PARTS = [['word/document.xml', 'المتن', false], ['word/footnotes.xml', 'الهوامش', true], ['word/endnotes.xml', 'الحواشي الختامية', true]];
  // Walk every proofreadable paragraph of a docx in a stable order; fn(p, key, where, inNotes)
  async function walk(zip, xml, fn) {
    const docs = [];
    for (const [path, where, inNotes] of PARTS) {
      const f = zip.file(path);
      if (!f) continue;
      const doc = xml.parse(await f.async('string'));
      docs.push([path, doc]);
      const ps = Array.from(doc.getElementsByTagNameNS(W, 'p'));
      let k = 0;
      for (const p of ps) {
        let anc = p.parentNode, skip = false;
        while (anc && anc.nodeType === 1) { if (isW(anc, 'ins') || isW(anc, 'del') || (anc.getAttributeNS && /separator|continuation/i.test(anc.getAttributeNS(W, 'type') || ''))) skip = true; anc = anc.parentNode; }
        if (skip) continue;
        fn(p, path + '#' + (k++), where, inNotes);
      }
    }
    return docs;
  }

  // Read a docx for the editor: every Arabic paragraph with its rule groups
  async function loadDocx(JSZip, buf, opts, xml) {
    const zip = await JSZip.loadAsync(buf);
    const raw = [];
    await walk(zip, xml, (p, key, where, inNotes) => {
      const rp = readParagraph(p);
      if (rp) raw.push({ key, where, inNotes, text: rp.text });
    });
    const lexicon = buildLexicon(raw.map(r => r.text));
    const paras = raw.map(r => {
      const g = findGroups(r.text, { opts, where: r.where, inNotes: r.inNotes, lexicon });
      return Object.assign(r, { groups: g.groups, warnings: g.warnings, quran: g.quran });
    });
    return { paras, lexicon };
  }

  // Word counts for the whole document (harakat removed), used by rules that look for the document's own spelling
  function buildLexicon(texts) {
    const lex = new Map();
    for (const t of texts) for (const w of t.replace(/[\u064B-\u065F\u0670\u0640]/g, '').split(/[^\u0621-\u064A]+/)) if (w) lex.set(w, (lex.get(w) || 0) + 1);
    return lex;
  }

  // Write the editor's decisions back: decide(key, text) -> edits on the original text (or null for none)
  async function exportDocx(JSZip, buf, decide, opts, xml) {
    const zip = await JSZip.loadAsync(buf);
    const ctx = { opts, nextId: 880000, date: new Date().toISOString().replace(/\.\d+Z$/, 'Z') };
    const docs = await walk(zip, xml, (p, key) => {
      const rp = readParagraph(p);
      if (!rp) return;
      const edits = decide(key, rp.text);
      if (edits && edits.length) rebuild(p, rp.segs, rp.text, edits, ctx);
    });
    for (const [path, doc] of docs) zip.file(path, xml.serialize(doc));
    return zip.generateAsync({ type: opts.outType || 'uint8array', compression: 'DEFLATE', mimeType: 'application/vnd.openxmlformats-officedocument.wordprocessingml.document' });
  }

  function applyEdits(text, edits) {
    let out = text;
    [...edits].sort((a, b) => b.start - a.start || b.end - a.end).forEach(e => { out = out.slice(0, e.start) + e.repl + out.slice(e.end); });
    return out;
  }
  function snippet(text, lo, hi) {
    const a = Math.max(0, lo - 28), b = Math.min(text.length, hi + 28);
    return { pre: (a > 0 ? '…' : '') + text.slice(a, lo), mid: text.slice(lo, hi), post: text.slice(hi, b) + (b < text.length ? '…' : '') };
  }

  // ---------------------------------------------------------------- XML rebuild
  function rebuild(p, segs, text, edits, ctx) {
    const doc = p.ownerDocument;
    const delAt = new Array(text.length).fill(null);
    const insAt = new Map();
    for (const e of edits) {
      for (let i = e.start; i < e.end; i++) delAt[i] = e.rule;
      if (e.repl) { if (!insAt.has(e.start)) insAt.set(e.start, []); insAt.get(e.start).push(e); }
    }
    const textSegs = segs.filter(s => s.kind === 'text' && s.text.length);
    // who emits each insertion: the text run containing the position, else the text run ending there, else standalone
    const owner = new Map();
    for (const pos of insAt.keys()) {
      let o = textSegs.find(s => s.start <= pos && pos < s.start + s.text.length);
      if (!o) o = [...textSegs].reverse().find(s => s.start + s.text.length === pos);
      owner.set(pos, o || null);
    }
    const el = name => doc.createElementNS(W, 'w:' + name);
    const mark = (kind, rule) => {
      const m = el(kind);
      m.setAttributeNS(W, 'w:id', String(ctx.nextId++));
      m.setAttributeNS(W, 'w:author', rule.author || ((rule.no ? 'قاعدة ' + rule.no : rule.label || 'قائمة الكلمات') + ': ' + rule.name));
      m.setAttributeNS(W, 'w:date', ctx.date);
      return m;
    };
    const run = (rPr, str, tag) => {
      const r = el('r');
      if (rPr) r.appendChild(rPr.cloneNode(true));
      const t = el(tag);
      t.setAttributeNS(XMLNS, 'xml:space', 'preserve');
      t.appendChild(doc.createTextNode(str));
      r.appendChild(t);
      return r;
    };
    const insNodes = (rPr, list) => list.map(e => {
      if (ctx.opts.clean) return run(rPr, e.repl, 't');
      const m = mark('ins', e.rule); m.appendChild(run(rPr, e.repl, 't')); return m;
    });
    const rPrOf = seg => seg && kids(seg.node).find(c => isW(c, 'rPr'));
    let prevText = null;
    for (const seg of segs) {
      if (seg.kind !== 'text' || !seg.text.length) {
        if (seg.text.length && insAt.has(seg.start) && owner.get(seg.start) === null) {
          insNodes(rPrOf(prevText), insAt.get(seg.start)).forEach(n => p.insertBefore(n, seg.node));
          owner.delete(seg.start);
        }
        continue;
      }
      prevText = seg;
      const rPr = rPrOf(seg);
      const nodes = [];
      const end = seg.start + seg.text.length;
      const mine = pos => insAt.has(pos) && owner.get(pos) === seg;
      let i = seg.start;
      while (i < end) {
        if (mine(i)) nodes.push(...insNodes(rPr, insAt.get(i)));
        const rule = delAt[i];
        let j = i + 1;
        while (j < end && delAt[j] === rule && !mine(j)) j++;
        const str = text.slice(i, j);
        if (rule === null) nodes.push(run(rPr, str, 't'));
        else if (!ctx.opts.clean) { const m = mark('del', rule); m.appendChild(run(rPr, str, 'delText')); nodes.push(m); }
        i = j;
      }
      if (mine(end)) nodes.push(...insNodes(rPr, insAt.get(end)));
      nodes.forEach(n => p.insertBefore(n, seg.node));
      p.removeChild(seg.node);
    }
    const tail = text.length;
    if (insAt.has(tail) && owner.get(tail) === null) insNodes(rPrOf(prevText), insAt.get(tail)).forEach(n => p.appendChild(n));
  }

  // ---------------------------------------------------------------- docx entry
  async function processDocx(JSZip, buf, opts, xml) {
    const zip = await JSZip.loadAsync(buf);
    const ctx = { opts, changes: [], warnings: [], nextId: 880000, date: new Date().toISOString().replace(/\.\d+Z$/, 'Z') };
    const parts = [['word/document.xml', 'المتن', false], ['word/footnotes.xml', 'الهوامش', true], ['word/endnotes.xml', 'الحواشي الختامية', true]];
    let paragraphs = 0;
    for (const [path, where, inNotes] of parts) {
      const f = zip.file(path);
      if (!f) continue;
      const doc = xml.parse(await f.async('string'));
      ctx.where = where; ctx.inNotes = inNotes;
      const ps = Array.from(doc.getElementsByTagNameNS(W, 'p'));
      for (const p of ps) {
        // skip separator footnotes and paragraphs nested inside revisions
        let anc = p.parentNode, skip = false;
        while (anc && anc.nodeType === 1) { if (isW(anc, 'ins') || isW(anc, 'del') || (anc.getAttributeNS && /separator|continuation/i.test(anc.getAttributeNS(W, 'type') || ''))) skip = true; anc = anc.parentNode; }
        if (skip) continue;
        paragraphs++;
        processParagraph(p, ctx);
      }
      zip.file(path, xml.serialize(doc));
    }
    const out = await zip.generateAsync({ type: opts.outType || 'uint8array', compression: 'DEFLATE', mimeType: 'application/vnd.openxmlformats-officedocument.wordprocessingml.document' });
    return { data: out, changes: ctx.changes, warnings: ctx.warnings, paragraphs };
  }

  const api = { processDocx, loadDocx, exportDocx, findGroups, buildLexicon, diffEdits, applyEdits, RULES, FN, OB, _processParagraph: processParagraph };

})(typeof window !== 'undefined' ? window : globalThis);

      if (acc.length) return st.hideAcc ? `<span class="plain" ${attrs}>${showChars(old)}</span>` : `<span class="done wd ${cls}" ${attrs}>${showChars(old)}</span>`;
      return `<span class="rej ${cls}" ${attrs}>${showChars(S)}</span>`;
    }
    // punctuation and spacing between words: show exactly what changes
    return s.list.map(({ e, g }) => {
      const del = t.slice(e.start, e.end), c = 'c-' + (g.rule.cat || 'punct') + (st.sel === g.id ? ' sel' : ''), at = `data-g="${g.id}" data-gs="${g.id}"`;
      if (g.status === 'accepted') {
        if (st.hideAcc) return e.repl ? `<span class="plain" ${at}>${showChars(e.repl)}</span>` : '';
        return e.repl ? `<span class="done ${c}" ${at}>${vis(e.repl)}</span>` : `<span class="done gap ${c}" ${at}></span>`;
      }
      if (g.status === 'rejected') return `<span class="rej ${c}" ${at}>${showChars(del)}</span>`;
      return `<span class="chg ${c}${e.repl ? '' : ' only-del'}" ${at}>${del ? '<del>' + vis(del) + '</del>' : ''}${e.repl ? '<ins>' + vis(e.repl) + '</ins>' : ''}</span>`;
    }).join('');
  }
  function paraHTML(p) {
    const t = p.base, n = t.length, segs = segments(p);
    let h = '', i = 0, k = 0, inQ = false;
    const q = j => p.quran.some(([a, b]) => j >= a && j <= b);
    while (i <= n) {
      while (k < segs.length && segs[k].a === i && segs[k].b === i) h += segHTML(t, segs[k++]);
      if (i === n) break;
      if (k < segs.length && segs[k].a === i) { if (inQ) { h += '</span>'; inQ = false; } h += segHTML(t, segs[k]); i = segs[k++].b; continue; }
      const nq = q(i);
      if (nq !== inQ) { h += nq ? '<span class="quran" title="نص قرآني محمي">' : '</span>'; inQ = nq; }
      if (!(st.noHarakat && !inQ && HARAKA.test(t[i]))) h += showChars(t[i]);

  function paraEl(p) {
    const el = document.createElement('p');

  }
  function renderPage() {
    const page = $('page');

    const body = st.paras.filter(p => !p.inNotes), notes = st.paras.filter(p => p.inNotes);
    if (!st.paras.length) { page.innerHTML = '<p class="empty">افتح ملف وورد لتبدأ، أو اسحبه إلى هنا.</p>'; return; }

  function rerenderPara(p) {
    const old = document.querySelector(`.para[data-key="${CSS.escape(p.key)}"]`);
    if (old) old.replaceWith(paraEl(p)); else renderPage();
  }
  const currentText = p => E.applyEdits(p.base, p.groups.filter(g => g.status === 'accepted').flatMap(g => g.edits));

  // ---------------- side panel
  function counts() {
    const c = { all: 0, punct: 0, spell: 0, conv: 0, style: 0 }, s = { pending: 0, accepted: 0, rejected: 0 };
    allGroups().forEach(([, g]) => { s[g.status]++; if (g.status === 'pending') { c.all++; c[g.rule.cat]++; } });
    return { c, s };
  }
  function renderCats() {
    const { c } = counts();
    $('cats').innerHTML = ['all', 'punct', 'spell', 'conv', 'style'].map(k => {
      const off = k === 'style', on = st.cat === k;
      const acc = !off && c[k] ? `<button type="button" class="link" data-accept="${k}">قبول الكل</button>` : '';
      return `<div class="sum-row c-${k}${on ? ' on' : ''}${off ? ' off' : ''}"><button type="button" class="pick" data-cat="${k}" title="${k === 'all' ? 'كل التصحيحات' : CATS[k]}" ${off ? 'disabled title="يأتي مع طبقة الذكاء الاصطناعي"' : ''} aria-pressed="${on}">${k === 'all' ? '<span class="dot" style="background:var(--ink)"></span>' : '<span class="dot"></span>'}<span class="nm">${k === 'all' ? 'كل التصحيحات' : CATS[k]}</span><b>${off ? 'لاحقاً' : c[k]}</b></button>${acc}</div>`;
    }).join('');
    $('page').className = 'page' + (st.cat !== 'all' ? ' focus-' + st.cat : '');
  }
  function cardHTML(p, g) {
    const b = g.before, a = g.after, cat = g.rule.cat || 'punct';
    const rno = g.rule.no ? 'القاعدة ' + g.rule.no : (g.rule.label || 'قائمة الكلمات');
    let foot;
    if (g.status === 'pending') foot = `<div class="acts"><button class="btn ok" type="button" data-act="accept">قبول</button><button class="btn no" type="button" data-act="reject">رفض</button></div>`;
    else {
      foot = `<div class="acts"><span class="state ${g.status === 'accepted' ? 'ok' : 'no'}">${g.status === 'accepted' ? '✓ مقبول' : '✕ مرفوض'}</span><button class="link" type="button" data-act="reset">تغيير القرار</button></div>`;
      if (g.status === 'rejected') foot += `<input class="reason" id="reason-${g.id}" data-act="reason" placeholder="سبب الرفض (اختياري، تتعلم منه الأداة لاحقاً)" value="${esc(g.reason || '')}">`;
    }
    return `<div class="card c-${cat}${st.sel === g.id ? ' sel' : ''}${g.status !== 'pending' ? ' decided' : ''}" data-g="${g.id}" tabindex="0">
      <div class="card-h"><span class="dot"></span><span class="name">${esc(g.rule.name)}</span><span class="rno">${rno}</span></div>
      <div class="ba"><div><span class="k">قبل</span><span class="t">${showChars(b.pre)}<mark class="d">${vis(b.mid) || '&#8203;'}</mark>${showChars(b.post)}</span></div>
      <div><span class="k">بعد</span><span class="t">${showChars(a.pre)}<mark class="i">${vis(a.mid)}</mark>${showChars(a.post)}</span></div></div>
      <p class="why">${esc(g.rule.why)}${p.inNotes ? ' <span class="tag">في الهوامش</span>' : ''}</p>${foot}</div>`;
  }
  function visibleGroups() {
    return allGroups().filter(([, g]) => (st.cat === 'all' || g.rule.cat === st.cat) && (st.show === 'all' || g.status === 'pending'));
  }
  function renderCards() {
    const list = visibleGroups();
    const { s } = counts();
    $('sideCount').textContent = `${s.pending} من ${s.pending + s.accepted + s.rejected} بانتظار القرار`;
    $('cards').innerHTML = list.length ? list.map(([p, g]) => cardHTML(p, g)).join('')
      : `<div class="empty">${s.pending + s.accepted + s.rejected ? 'لا تصحيحات بانتظار القرار هنا. يمكنك تصدير الملف الآن.' : 'لم تجد قواعد الدليل ما يُصحَّح في هذا النص.'}</div>`;

  function renderBar() {
    const { s } = counts();

    let words = 0, chars = 0;
    const WRX = new RegExp('[^\\s' + FN + OB + ']+', 'g'), CRX = new RegExp('[\\s' + FN + OB + '\\u064B-\\u0652\\u0670\\u0640]', 'g');
    st.paras.forEach(p => { const t = currentText(p); words += (t.match(WRX) || []).length; chars += t.replace(CRX, '').length; });

  }
  function renderAll() {
    $('docName').textContent = st.name.replace(/\.docx$/i, '') || '—';
    $('docTag').hidden = !st.sample;
    renderPage(); renderCards();
  }

  // ---------------- selection & decisions
  function select(id, from) {
    st.sel = id;
    document.querySelectorAll('.sel').forEach(e => e.classList.remove('sel'));
    document.querySelectorAll(`.cards [data-g="${id}"], .page [data-gs~="${id}"]`).forEach(e => e.classList.add('sel'));
    const span = document.querySelector(`.page [data-gs~="${id}"]`), card = document.querySelector(`.cards [data-g="${id}"]`);
    if (from !== 'text' && span) span.scrollIntoView({ block: 'center', behavior: 'smooth' });
    if (from !== 'card' && card) card.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
  }
  function decide(id, status, quiet) {
    const [p, g] = findG(id); if (!g) return;
    snapshot();
    const order = visibleGroups().map(([, x]) => x.id), at = order.indexOf(id);
    g.status = status; if (status !== 'rejected') g.reason = '';
    rerenderPara(p); renderCards();

    const next = visibleGroups().map(([, x]) => x).find((x, i, arr) => x.status === 'pending' && order.indexOf(x.id) > at) || visibleGroups().map(([, x]) => x).find(x => x.status === 'pending');
    if (status === 'rejected') { select(id, 'card'); const r = $('reason-' + id); if (r) r.focus({ preventScroll: true }); }
    else if (next) select(next.id); else st.sel = null;
  }
  function acceptCat(cat) {

    if (!list.length) return;
    snapshot();
    list.forEach(([, g]) => { g.status = 'accepted'; });
    renderAll();
    say(`قُبل ${list.length.toLocaleString('ar')} تصحيحاً.`);
  }
  function recheck() {
    if (!st.paras.length) return;
    snapshot();
    st.paras.forEach(p => scan(p, new Map(p.groups.map(g => [sig(g), g]))));

  }

  // ---------------- popup on an error in the text (one block per correction in that word)
  const pop = $('pop');
  let popKey = null, hideT = null, pinned = false;
  const spanOf = id => document.querySelector(`.page [data-gs~="${id}"]`);
  function popBlock(g) {
    const rno = g.rule.no ? 'القاعدة ' + g.rule.no : (g.rule.label || 'قائمة الكلمات');
    const d = g.before.mid, r = g.after.mid;
    const line = g.edits.length > 1 || (d && r) ? `<del>${vis(d)}</del><span class="arr">←</span><ins>${vis(r)}</ins>`
      : d ? `<span class="arr">حذف</span><del>${vis(d)}</del>` : `<span class="arr">إضافة</span><ins>${vis(r)}</ins>`;
    let foot;
    if (g.status === 'pending') foot = `<div class="acts"><button class="btn ok" type="button" data-act="accept">قبول</button><button class="btn no" type="button" data-act="reject">رفض</button></div>`;
    else {
      foot = `<div class="acts"><span class="state ${g.status === 'accepted' ? 'ok' : 'no'}">${g.status === 'accepted' ? '✓ مقبول' : '✕ مرفوض'}</span><button class="link" type="button" data-act="reset">تغيير القرار</button></div>`;
      if (g.status === 'rejected') foot += `<input class="reason" id="pop-reason-${g.id}" data-act="reason" placeholder="سبب الرفض (اختياري، تتعلم منه الأداة لاحقاً)" value="${esc(g.reason || '')}">`;
    }
    return `<div class="pg" data-id="${g.id}"><div class="card-h c-${g.rule.cat}"><span class="dot"></span><span class="name">${esc(g.rule.name)}</span><span class="rno">${rno}</span></div>
      <div class="chgline">${line}</div><p class="why">${esc(g.rule.why)}</p>${foot}</div>`;
  }
  function placePop(anchor) {
    const r = anchor.getBoundingClientRect(), W = 300, gap = 8;
    pop.hidden = false;
    const h = pop.offsetHeight;
    let left = r.left + r.width / 2 - W / 2;
    left = Math.max(8, Math.min(left, window.innerWidth - W - 8));
    let top = r.top - h - gap;
    if (top < 8) top = r.bottom + gap;
    pop.style.left = left + 'px'; pop.style.top = top + 'px';
  }
  function showPop(anchor) {
    clearTimeout(hideT);
    const key = anchor.dataset.gs || anchor.dataset.g;
    const gs = key.split(' ').map(id => findG(id)[1]).filter(Boolean); if (!gs.length) return;
    const state = gs.map(g => g.status).join(' ');
    if (popKey !== key) pinned = false;
    if (popKey === key && !pop.hidden && pop.dataset.state === state) return;
    const same = popKey === key && !pop.hidden;

    document.querySelectorAll('.hot').forEach(e => e.classList.remove('hot'));
    anchor.classList.add('hot');
    pop.innerHTML = gs.map(popBlock).join('<hr class="pg-sep">');
    if (!same) placePop(anchor);
  }
  function hidePop(now) {
    clearTimeout(hideT);

  // ---------------- manual edit
  function saveEdit(el) {
    const p = st.byKey.get(el.dataset.key), ta = el.querySelector('textarea'), err = el.querySelector('.err');

  // ---------------- export
  let downloads = null;
  if (window.claude && window.claude.use) window.claude.use('downloads').then(d => { downloads = d; }).catch(() => {});
  async function exportDoc(clean) {
    if (!st.buf) return;
    let skipped = 0;
    const decideFn = (key, text) => {
      const p = st.byKey.get(key);
      if (!p || p.orig !== text) return null;
      const acc = p.groups.filter(g => g.status === 'accepted').flatMap(g => g.edits);
      if (!p.manual) return acc;
      const edits = E.diffEdits(p.orig, E.applyEdits(p.base, acc), MANUAL_RULE);
      if (edits.some(e => /[￼]/.test(e.repl + p.orig.slice(e.start, e.end)))) { skipped++; return null; }
      return edits;
    };
    try {
      const data = await E.exportDocx(JSZip, st.buf.slice(0), decideFn, Object.assign({ clean }, opts()), xml);
      const fname = st.name.replace(/\.docx$/i, '') + (clean ? ' - نظيف' : ' - مدقق') + '.docx';
      if (!downloads) { say('التنزيل غير متاح في هذا العرض. افتح الصفحة في claude.ai لتنزيل الملف.', true); return; }
      await downloads.save({ filename: fname, data: new Blob([data]) });
      const { s } = counts();
      say((clean ? 'نُزّلت النسخة النظيفة.' : 'نُزّل الملف بالتعديلات المتتبَّعة.') + (s.pending ? ` لم تدخل ${s.pending.toLocaleString('ar')} تصحيحات بانتظار القرار.` : '') + (skipped ? ` تعذّر نقل تعديل يدوي في ${skipped} فقرة.` : ''));
    } catch (e) {
      if (e && e.code === 'declined') return;
      say('تعذّر إنشاء الملف: ' + (e && e.message || e), true);
    }
  }

  function say(t, err) { $('msg').textContent = t || ''; $('msg').className = 'msg' + (err ? ' err' : ''); }

  // ---------------- events
  $('page').addEventListener('click', ev => {
    const act = ev.target.closest('[data-act]');

      if (a === 'cancel') { st.editing = null; rerenderPara(st.byKey.get(para.dataset.key)); return; }

  });
  $('cards').addEventListener('click', ev => {
    const card = ev.target.closest('.card'); if (!card) return;
    const act = ev.target.closest('[data-act]');
    if (act && act.dataset.act === 'accept') return decide(card.dataset.g, 'accepted');
    if (act && act.dataset.act === 'reject') return decide(card.dataset.g, 'rejected');
    if (act && act.dataset.act === 'reset') return decide(card.dataset.g, 'pending');
    if (act && act.dataset.act === 'reason') return;
    select(card.dataset.g, 'card');
  });
  $('cards').addEventListener('keydown', ev => {
    const card = ev.target.closest('.card');
    if (!card || ev.target !== card) return;
    if (ev.key === 'Enter') select(card.dataset.g, 'card');
  });
  $('cards').addEventListener('input', ev => {
    if (ev.target.dataset.act !== 'reason') return;

  });
  $('cats').addEventListener('click', ev => {
    const acc = ev.target.closest('[data-accept]'); if (acc) return acceptCat(acc.dataset.accept);

  });

    $('listToggle').textContent = open ? 'إخفاء قائمة التصحيحات' : 'عرض قائمة التصحيحات';
  });
  $('showPending').addEventListener('click', () => { st.show = 'pending'; $('showPending').setAttribute('aria-pressed', 'true'); $('showAll').setAttribute('aria-pressed', 'false'); renderCards(); });
  $('showAll').addEventListener('click', () => { st.show = 'all'; $('showAll').setAttribute('aria-pressed', 'true'); $('showPending').setAttribute('aria-pressed', 'false'); renderCards(); });
  $('checkBtn').addEventListener('click', recheck);
  $('expTracked').addEventListener('click', () => exportDoc(false));
  $('expClean').addEventListener('click', () => exportDoc(true));
  $('warnBtn').addEventListener('click', () => {
    const w = st.paras.filter(p => p.warnings.length); if (!w.length) return;

    const el = document.querySelector(`.para[data-key="${CSS.escape(p.key)}"]`);

  });
  const openFile = f => {
    if (!f) return;
    if (!/\.docx$/i.test(f.name)) { say('الأداة تقبل ملفات وورد بصيغة ‎.docx فقط.', true); return; }
    f.arrayBuffer().then(b => load(b, f.name, false)).catch(e => say('تعذّرت قراءة الملف: ' + e.message, true));
  };
  $('openBtn').addEventListener('click', () => $('file').click());
  $('file').addEventListener('change', e => { openFile(e.target.files[0]); e.target.value = ''; });
  const page = $('page');
  ['dragenter', 'dragover'].forEach(t => page.addEventListener(t, e => { e.preventDefault(); page.classList.add('drag'); }));
  ['dragleave', 'drop'].forEach(t => page.addEventListener(t, e => { e.preventDefault(); page.classList.remove('drag'); }));
  page.addEventListener('drop', e => openFile(e.dataTransfer.files[0]));
  document.addEventListener('keydown', e => {
    if (!(e.ctrlKey || e.metaKey) || /TEXTAREA|INPUT|SELECT/.test(e.target.tagName)) return;
    // e.code works with the Arabic keyboard layout too
    if (e.code === 'KeyZ' && !e.shiftKey) { e.preventDefault(); undo(); }
    else if (e.code === 'KeyY' || (e.code === 'KeyZ' && e.shiftKey)) { e.preventDefault(); redo(); }
  });

  // ---------------- show/hide tashkeel
  $('harakatBtn').addEventListener('click', () => {
    st.noHarakat = !st.noHarakat;
    $('harakatBtn').setAttribute('aria-pressed', String(st.noHarakat));
    $('harakatBtn').textContent = st.noHarakat ? 'إظهار التشكيل' : 'إخفاء التشكيل';
    renderPage();
    say(st.noHarakat ? 'أُخفي التشكيل من العرض فقط، وبقي في الملف. يبقى ظاهراً داخل التصحيحات والآيات.' : '');
  });

  // ---------------- clean view: accepted corrections as plain text
  $('hideAccBtn').addEventListener('click', () => {
    st.hideAcc = !st.hideAcc;
    $('hideAccBtn').setAttribute('aria-pressed', String(!st.hideAcc));
    $('hideAccBtn').textContent = st.hideAcc ? 'إظهار المقبول' : 'إخفاء المقبول';
    renderPage();
    say(st.hideAcc ? 'النسخة النظيفة: التصحيحات المقبولة تظهر نصاً عادياً. مرّر الفأرة فوق الكلمة لترى قرارها.' : 'تظهر التصحيحات المقبولة بخط أخضر تحتها.');
  });

  // ---------------- light / dark
  const root = document.documentElement;
  const sysDark = () => !!(window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
  const isDark = () => root.getAttribute('data-theme') ? root.getAttribute('data-theme') === 'dark' : sysDark();
  function applyTheme(t) {
    if (t) root.setAttribute('data-theme', t); else root.removeAttribute('data-theme');
    const tl = isDark() ? 'الوضع النهاري' : 'الوضع الليلي';
    $('themeBtn').querySelector('.lbl').textContent = tl; $('themeBtn').title = tl;
    $('themeBtn').querySelector('svg').innerHTML = isDark() ? '<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>' : '<path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"/>';
  }
  applyTheme(store.get('theme', null));
  // القائمة الجانبية: تظهر وتختفي، ويُحفظ اختيار المدقق
  const setNav = on => { $('shell').classList.toggle('nav-open', on); $('navBtn').setAttribute('aria-expanded', String(on)); };
  setNav(store.get('navOpen', false));
  const setSide = on => { document.querySelector('.main').classList.toggle('side-closed', !on); $('sideBtn').setAttribute('aria-expanded', String(on)); };
  setSide(store.get('sideOpen', true));
  $('sideBtn').addEventListener('click', () => { const on = document.querySelector('.main').classList.contains('side-closed'); store.set('sideOpen', on); setSide(on); });
  $('navBtn').addEventListener('click', () => { const on = !$('shell').classList.contains('nav-open'); store.set('navOpen', on); setNav(on); });
  $('nav').addEventListener('click', ev => { const a = ev.target.closest('a'); if (a) ev.preventDefault(); });
  $('themeBtn').addEventListener('click', () => { const t = isDark() ? 'light' : 'dark'; store.set('theme', t); applyTheme(t); });

  // ---------------- checking options
  const EX = {
    'sp-before': ['قال الكاتب ، ثم سكت .', 'قال الكاتب، ثم سكت.'], 'sp-after': ['قال الكاتب،ثم سكت.', 'قال الكاتب، ثم سكت.'],
    'br-inner': ['كتاب ( الأخلاق )', 'كتاب (الأخلاق)'], 'dash-pair': ['وهذا - كما قلنا - صحيح', 'وهذا -كما قلنا- صحيح'],
    'dash-num': ['الصفحات 10 - 20', 'الصفحات 10-20'], 'slash': ['الداخل/الخارج', 'الداخل/ الخارج'], 'sp-double': ['قال  الكاتب', 'قال الكاتب'],
    'dot-out': ['(الأخلاق أساس.)', '(الأخلاق أساس).'], 'aw-quote': ['الدولة "أو (المتحدة)"', 'الدولة أو (المتحدة)'],
    'fn-space': ['نهاية الجملة.¹', 'نهاية الجملة¹.'], 'year-paren': ['في عام (1950)', 'في عام 1950'],
    'ma-la': ['مازال، لابد', 'ما زال، لا بد'], 'ma-shadda': ['شخصاً مّا', 'شخصاً ما'], 'sun-shadda': ['الشّمس والنّور', 'الشمس والنور'],
    'nisba-shadda': ['الأخلاقيّة', 'الأخلاقية'], 'tanween': ['واضحًا جدًا', 'واضحاً جداً'], 'months': ['3 مارس', '3 آذار/ مارس'],
    'salawat': ['النبي صلى الله عليه وآله وسلم', 'النبي (ص)'], 'salam': ['الإمام علي عليه السلام', 'الإمام علي (ع)'],
    'tatweel': ['ال Ethics', 'الـ Ethics'], 'page': ['ص 22', 'ص22'], 'abbr': ['ط 2', 'ط2'], 'ibid': ['المرجع نفسه، مرجع سابق', 'المصدر نفسه، مصدر سابق'],
    'ya-dots': ['فى كتابه التى ألفها', 'في كتابه التي ألفها'], 'inna': ['قال أن الضمير فطري', 'قال إنّ الضمير فطري'],
    'shadda-common': ['إن الضمير، وكل إنسان', 'إنّ الضمير، وكلّ إنسان'], 'quote-type': ['قال "الضمير صوت"', 'قال (الضمير صوت)'],
    'digits': ['عام ١٩٥٠', 'عام 1950'], 'words': ['المسئول', 'المسؤول']
  };
  const optRules = () => E.RULES.filter(r => CATS[r.cat] && r.cat !== 'style');
  const optCount = () => { const rs = optRules(), on = rs.filter(r => !st.off.has(r.id)).length; $('optsCount').textContent = `${on.toLocaleString('ar')} من ${rs.length.toLocaleString('ar')} قاعدة مفعّلة`; };
  function renderOpts() {
    const rules = optRules();
    $('optsBody').innerHTML = ['punct', 'spell', 'conv'].map(cat => {
      const rows = rules.filter(r => r.cat === cat).map(r => {
        const on = !st.off.has(r.id), ex = EX[r.id];
        const rno = r.no ? 'القاعدة ' + r.no : (r.label || 'قائمة الكلمات');
        return `<tr class="${on ? '' : 'off'}"><td><div class="rn">${esc(r.name)}</div><span class="rno">${rno}</span>${r.scope === 'notes' ? ' <span class="tag">في الهوامش</span>' : ''}</td>
          <td>${esc(r.why)}</td><td class="ex">${ex ? `<del>${esc(ex[0])}</del><span class="arr">←</span><ins>${esc(ex[1])}</ins>` : ''}</td>
          <td class="sw"><input type="checkbox" class="switch" data-rule="${r.id}" ${on ? 'checked' : ''} aria-label="تشغيل ${esc(r.name)}"></td></tr>`;
      }).join('');
      return `<h3 class="c-${cat}"><span class="dot"></span>${CATS[cat]}</h3><table class="otable"><thead><tr><th>القاعدة</th><th>الشرح</th><th>مثال</th><th>تشغيل</th></tr></thead><tbody>${rows}</tbody></table>`;
    }).join('');
    optCount();
  }
  let optsDirty = false;
  $('optsBtn').addEventListener('click', () => { renderOpts(); optsDirty = false; hidePop(true); $('optsDlg').showModal(); });
  $('optsBody').addEventListener('change', ev => {
    const id = ev.target.dataset.rule; if (!id) return;
    if (ev.target.checked) st.off.delete(id); else st.off.add(id);
    store.set('off', [...st.off]); optsDirty = true;
    ev.target.closest('tr').classList.toggle('off', !ev.target.checked);
    optCount();
  });
  $('optsAllOn').addEventListener('click', () => { if (!st.off.size) return; st.off.clear(); store.set('off', []); optsDirty = true; renderOpts(); });
  $('optsClose').addEventListener('click', () => $('optsDlg').close());
  $('optsDlg').addEventListener('close', () => {
    if (!optsDirty) return;
    recheck();
    say(st.off.size ? `أُعيد الفحص، و${st.off.size.toLocaleString('ar')} من القواعد مطفأة.` : 'أُعيد الفحص بكل القواعد.');
  });

  // sample on open
  const bin = atob(SAMPLE_B64), bytes = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
  load(bytes.buffer, SAMPLE_NAME, true).catch(e => say('تعذّر تحميل المثال: ' + e.message, true));
})();
</script>
